<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>文献剪藏 · 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <h1>文献剪藏设置</h1>
        <p class="sub">连接到你的 GradWorkbench 工作台</p>
      </header>

      <div id="welcome" class="welcome hidden">
        <strong>安装成功。</strong>
        请先确认下方的服务地址与你本地运行的工作台一致，点「测试连接」验证后即可开始使用。
      </div>

      <section class="card">
        <h2>连接</h2>

        <label class="field">
          <span class="field__label">工作台地址</span>
          <input id="serverUrl" type="text" placeholder="http://localhost:3000" />
          <span class="field__hint">
            工作台运行的地址。若你改过端口，请同步修改这里。
          </span>
        </label>

        <label class="field">
          <span class="field__label">访问密钥（可选）</span>
          <input id="apiKey" type="password" placeholder="未设置则留空" autocomplete="off" />
          <span class="field__hint">
            仅当服务端配置了环境变量 <code>CLIPPER_TOKEN</code> 时才需要填写，
            两者必须一致。
          </span>
        </label>

        <div class="actions">
          <button id="btn-test" class="btn btn--ghost" type="button">测试连接</button>
          <span id="test-result" class="result"></span>
        </div>
      </section>

      <section class="card">
        <h2>剪藏行为</h2>

        <label class="field">
          <span class="field__label">默认标签（可选）</span>
          <input id="defaultTag" type="text" placeholder="如：待读" />
          <span class="field__hint">
            剪藏的文献会自动打上这个标签，便于事后集中整理。
          </span>
        </label>

        <label class="check">
          <input id="enrich" type="checkbox" />
          <span>
            <strong>自动补全元数据</strong>
            <em>
              页面上抓到 DOI 时，向 Crossref 查询卷、期、页码等字段；
              PubMed 页面则用 PMID 补全。关闭后只保存页面上能看到的内容。
            </em>
          </span>
        </label>

        <label class="check">
          <input id="autoBadge" type="checkbox" />
          <span>
            <strong>保存后显示角标提示</strong>
            <em>在扩展图标上短暂显示 ✓ 标记。</em>
          </span>
        </label>
      </section>

      <section class="card card--muted">
        <h2>使用方式</h2>
        <ul class="tips">
          <li>
            在<strong>知网、PubMed、arXiv、ScienceDirect</strong> 等论文详情页，
            右下角会出现「存入文献库」悬浮按钮。
          </li>
          <li>
            在 <strong>Google Scholar</strong> 搜索结果里，每条结果下方会有
            「＋ 存入文献库」小按钮，可逐条收录。
          </li>
          <li>
            任意页面点击工具栏上的扩展图标，可以预览并<strong>手动修改</strong>元数据后再保存。
          </li>
          <li>
            快捷键 <kbd>Alt</kbd> + <kbd>S</kbd> 直接剪藏当前页面。
          </li>
        </ul>
      </section>

      <footer class="foot">
        <button id="btn-save" class="btn btn--primary" type="button">保存设置</button>
        <span id="save-result" class="result"></span>
      </footer>
    </div>

    <script src="options.js"></script>
  </body>
</html>
